
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle, #101a35, #02030c);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

h1 {
    position: absolute;
    top: 25px;
    text-align: center;
    letter-spacing: 5px;
    font-size: 25px;
    text-shadow: 0 0 15px cyan;
}

.solar-system {
    position: relative;
    width: 650px;
    height: 650px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: scale(min(1, 90vw / 650));
}

.sun {
    width: 65px;
    height: 65px;
    background: radial-gradient(circle, #fff7a0, #ff9800, #ff3300);
    border-radius: 50%;
    box-shadow: 0 0 30px #ff9800,
                0 0 70px #ff6600;
    position: absolute;
    z-index: 10;
}

.orbit {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    animation: rotate linear infinite;
}

.planet {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate(-50%, -50%);
    border-radius: 50%;
}

/* Planet orbits */

.mercury-orbit {
    width: 100px;
    height: 100px;
    animation-duration: 4s;
}

.venus-orbit {
    width: 155px;
    height: 155px;
    animation-duration: 7s;
}

.earth-orbit {
    width: 215px;
    height: 215px;
    animation-duration: 10s;
}

.mars-orbit {
    width: 275px;
    height: 275px;
    animation-duration: 15s;
}

.jupiter-orbit {
    width: 370px;
    height: 370px;
    animation-duration: 25s;
}

.saturn-orbit {
    width: 460px;
    height: 460px;
    animation-duration: 35s;
}

.uranus-orbit {
    width: 550px;
    height: 550px;
    animation-duration: 45s;
}

.neptune-orbit {
    width: 640px;
    height: 640px;
    animation-duration: 55s;
}

.mercury {
    width: 9px;
    height: 9px;
    background: #aaa;
}

.venus {
    width: 15px;
    height: 15px;
    background: #d6a15c;
}

.earth {
    width: 17px;
    height: 17px;
    background: #168cff;
    box-shadow: inset -4px -3px 4px #003366;
}

.mars {
    width: 13px;
    height: 13px;
    background: #e64b24;
}

.jupiter {
    width: 35px;
    height: 35px;
    background: linear-gradient(#dba77a 25%, #98613e 35%, #e5bd8b 55%, #9e6949 75%);
}

.saturn {
    width: 29px;
    height: 29px;
    background: #e7c78c;
}

.saturn::after {
    content: "";
    position: absolute;
    width: 48px;
    height: 13px;
    border: 3px solid #c9a66b;
    border-radius: 50%;
    top: 7px;
    left: -10px;
    transform: rotate(-20deg);
}

.uranus {
    width: 22px;
    height: 22px;
    background: #80dce4;
}

.neptune {
    width: 21px;
    height: 21px;
    background: #2255e8;
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* Stars */

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 70% 20%, white, transparent),
        radial-gradient(2px 2px at 40% 80%, white, transparent),
        radial-gradient(1px 1px at 80% 70%, white, transparent),
        radial-gradient(2px 2px at 10% 90%, white, transparent),
        radial-gradient(1px 1px at 60% 50%, white, transparent);
    background-size: 200px 200px;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
}

@media(max-width: 700px) {
    .solar-system {
        transform: scale(0.55);
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<h1>SOLAR SYSTEM</h1>

<div class="solar-system">

    <div class="sun"></div>

    <div class="orbit mercury-orbit">
        <div class="planet mercury"></div>
    </div>

    <div class="orbit venus-orbit">
        <div class="planet venus"></div>
    </div>

    <div class="orbit earth-orbit">
        <div class="planet earth"></div>
    </div>

    <div class="orbit mars-orbit">
        <div class="planet mars"></div>
    </div>

    <div class="orbit jupiter-orbit">
        <div class="planet jupiter"></div>
    </div>

    <div class="orbit saturn-orbit">
        <div class="planet saturn"></div>
    </div>

    <div class="orbit uranus-orbit">
        <div class="planet uranus"></div>
    </div>

    <div class="orbit neptune-orbit">
        <div class="planet neptune"></div>
    </div>

</div>

</body>
</html>
